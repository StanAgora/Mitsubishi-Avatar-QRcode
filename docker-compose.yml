# Used by quick-deploy.sh. No ports are published to the host — the shared
# reverse-proxy nginx (also on whip-network) proxies to mitsubishi-avatar-app:8080.
services:
  mitsubishi-avatar-app:
    container_name: mitsubishi-avatar-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VITE_BASE_PATH: ${APP_VITE_BASE_PATH:-/avatar/}
        VITE_AGORA_APP_ID: ${VITE_AGORA_APP_ID}
    env_file:
      - ./.env
    networks:
      - whip-network
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  whip-network:
    external: true
